# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: dcttechnology
# "service" is the name of this project. This will also be added to your AWS resource names.
service: serverless-job-queue-system
frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
          Resource:
            - Fn::GetAtt: [JobsTable, Arn]

        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - Fn::GetAtt: [JobQueue, Arn]

  environment:
    QUEUE_URL:
      Ref: JobQueue

functions:
  hello:
    handler: handler.hello
    events:
      - httpApi:
          path: /
          method: get
  
  createJob:
    handler: handler.createJob
    events:
      - httpApi:
          path: /job
          method: post

  getJob:
    handler: handler.getJob
    events:
      - httpApi:
          path: /job/{id}
          method: get

  worker:
    handler: handler.worker
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - JobQueue
              - Arn
    timeout: 60

resources:
  Resources:
    JobQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: job-queue
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - JobDLQ
              - Arn
          maxReceiveCount: 3

    JobsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: jobs
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: jobId
            AttributeType: S
        KeySchema:
          - AttributeName: jobId
            KeyType: HASH

    JobDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: job-dlq
